<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CAPTCHA admin</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body class="adm-body">
  <header class="adm-top">
    <div class="adm-top__brand">
      <span class="adm-top__mark" lang="ar" aria-hidden="true">كابتشا</span>
      <span>
        <strong class="adm-top__title" data-t="appName">لوحة تحكم الكابتشا</strong>
        <span class="adm-top__sub" data-t="appSub">Arabic Hybrid CAPTCHA</span>
      </span>
    </div>
    <div class="adm-top__state">
      <span class="adm-dirty" id="dirty-state" role="status" aria-live="polite"></span>
    </div>
    <div class="adm-top__actions">
      <button class="btn btn--small" type="button" id="undo-btn" data-t="undo" disabled>تراجع</button>
      <button class="btn btn--small" type="button" id="redo-btn" data-t="redo" disabled>إعادة</button>
      <button class="btn btn--small btn--quiet" type="button" id="discard-btn" data-t="discard" disabled>تجاهل التغييرات</button>
      <button class="btn btn--primary adm-save" type="button" id="save-btn" data-t="save" disabled>حفظ وتطبيق</button>
      <span class="adm-top__sep" aria-hidden="true"></span>
      <button class="btn btn--small btn--quiet" type="button" id="lang-btn" data-t="langSwitch">English</button>
      <button class="btn btn--small btn--quiet" type="button" id="logout-btn" data-t="logout">خروج</button>
    </div>
  </header>

  <div class="adm-shell">
    <nav class="adm-nav" aria-label="Sections">
      <a class="adm-nav__link" href="#letters" data-view="letters" data-t="nav_letters">الحروف</a>
      <a class="adm-nav__link" href="#words" data-view="words" data-t="nav_words">الكلمات</a>
      <a class="adm-nav__link" href="#layout" data-view="layout" data-t="nav_layout">التخطيط والمسافات</a>
      <a class="adm-nav__link" href="#preview" data-view="preview" data-t="nav_preview">معاينة الكابتشا</a>
      <a class="adm-nav__link" href="#history" data-view="history" data-t="nav_history">السجل والنشر</a>
      <p class="adm-nav__note" data-t="securityNote"></p>
    </nav>
    <main class="adm-main">
      <div class="adm-issues" id="issues" hidden></div>
      <div id="view" class="adm-view"><p class="adm-muted">…</p></div>
    </main>
  </div>

  <div class="adm-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="preview adm-dialog" id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog" class="preview__body">
      <h2 class="panel__title" id="confirm-title"></h2>
      <div class="adm-dialog__body" id="confirm-body"></div>
      <div class="adm-dialog__actions">
        <button class="btn" value="cancel" id="confirm-cancel" data-t="cancel">إلغاء</button>
        <button class="btn adm-danger" value="ok" id="confirm-ok" data-t="confirm">تأكيد</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/admin/app/main.js"></script>
</body>
</html>
