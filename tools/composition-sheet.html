<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Composition sheet</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; background: #e9e6df; color: #1d2430; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; align-items: flex-start; }
  figure { margin: 0; background: #fff; padding: 8px; border-radius: 8px; }
  figcaption { font-size: 12px; color: #555; }
  canvas { display: block; width: 640px; height: 220px; }
  pre { font-size: 12px; background: #fff; padding: 8px; max-width: 640px; overflow: auto; }
</style>
</head>
<body>
<h1>Composition sheet</h1>
<p>Every configured word rendered with and without guides (blue = entry point, orange = exit point,
teal box = handwritten, amber box = typed, dashed red = shared baseline). Development tool; open via the local server.</p>
<div id="out"></div>
<script type="module">
import { loadAllData } from '../src/scripts/data-loader.js';
import { LetterDatabase } from '../src/scripts/letter-database.js';
import { WordDatabase } from '../src/scripts/word-database.js';
import { CaptchaEngine } from '../src/scripts/captcha-engine.js';
import { defaultSettings } from '../src/scripts/settings.js';

const base = new URL('../', document.baseURI).href;
const data = await loadAllData(base);
const letters = new LetterDatabase(data.letters);
const words = new WordDatabase(data.words, letters);
const engine = new CaptchaEngine({ letters, words, composition: data.composition, baseUrl: base });
await engine.load();

const params = new URLSearchParams(location.search);
const settings = { ...defaultSettings(data.composition), ...(params.get('mode') ? { baselineMode: params.get('mode') } : {}) };
if (params.get('all') === 'hand') {
  // every letter handwritten where a sample exists
  for (const w of words.all()) {
    settings.characters[w.id] = {};
    words.resolve(w.id).forEach((l) => { if (l.handwrittenOptions.length) settings.characters[w.id][l.index] = { style: 'handwritten' }; });
  }
}
if (params.get('all') === 'typed') {
  for (const w of words.all()) {
    settings.characters[w.id] = {};
    words.resolve(w.id).forEach((l) => { settings.characters[w.id][l.index] = { style: 'typed' }; });
  }
}
const report = {};
const out = document.getElementById('out');
for (const w of words.all()) {
  const row = document.createElement('div'); row.className = 'row';
  for (const guides of [false, true]) {
    const fig = document.createElement('figure');
    const c = document.createElement('canvas');
    const r = engine.render(c, { wordId: w.id, settings: { ...settings, showGuides: guides }, seed: 7, dpr: 2 });
    fig.append(c);
    const cap = document.createElement('figcaption');
    cap.textContent = `${w.id}: ` + r.plan.map((l) => `${l.char}(${l.form}, ${l.style === 'handwritten' ? l.sample.id : 'typed'})`).join(' ');
    fig.append(cap); row.append(fig);
    if (!guides) {
      report[w.id] = {
        plan: r.plan.map((l) => ({ char: l.char, form: l.form, style: l.style, sample: l.sample?.id ?? null, warning: l.warning })),
        placements: r.layout.placements.map((p) => ({ x: +p.x.toFixed(1), y: +p.y.toFixed(1), connected: p.connected })),
        joins: r.layout.joins.map((j) => ({ from: j.from, to: j.to, dx: +(j.entry.x - j.exit.x).toFixed(2), dy: +(j.entry.y - j.exit.y).toFixed(2) })),
        fitScale: +r.fit.scale.toFixed(3),
        strokes: r.pieces.map((p) => +(p.strokeWidth / r.k).toFixed(2)),
        coverage: r.pieces.map((p) => p.kind === 'handwritten' ? +(p.inkCoverage / p.sourceCoverage).toFixed(3) : null),
      };
    }
  }
  out.append(row);
}
const pre = document.createElement('pre'); pre.textContent = JSON.stringify(report, null, 1); out.append(pre);
window.__sheet = report;
</script>
</body>
</html>
