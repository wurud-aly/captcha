<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تحقّق من أنك إنسان</title>
  <meta name="description" content="رتّب الحروف لتكوين الكلمة الصحيحة.">
  <meta name="theme-color" content="#eef2f5">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="public/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="public/assets/fonts/Cairo-Light.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
  <main class="page">
    <section class="captcha" id="captcha" aria-labelledby="captcha-title" data-state="loading">
      <header class="captcha__head">
        <span class="captcha__badge" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.4 3 8.3 7 9.5 4-1.2 7-5.1 7-9.5V6l-7-3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m9 12 2.2 2.2L15.5 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div class="captcha__titles">
          <h1 class="captcha__title" id="captcha-title">تحقّق من أنك إنسان</h1>
          <p class="captcha__hint" id="captcha-hint">اسحب الحروف ورتّبها لتكوين الكلمة الصحيحة.</p>
        </div>
        <button class="icon-btn" type="button" id="new-challenge" aria-label="تحدٍّ جديد" title="تحدٍّ جديد">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 0 1 12.8-5.3M19.5 12a7.5 7.5 0 0 1-12.8 5.3M17.5 3.5v3.4h-3.4M6.5 20.5v-3.4h3.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <div class="tray">
        <div class="tiles" id="tiles" role="group" aria-labelledby="captcha-hint" aria-describedby="keyboard-help"></div>
      </div>
      <p class="visually-hidden" id="keyboard-help">استخدم السهمين لتحريك الحرف المحدد، أو اختر حرفين لتبديل موضعيهما.</p>

      <div class="result-wrap">
        <div class="result" id="result" role="status" aria-live="polite">
          <svg class="result__check" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23" /><path d="m15 27 7.5 7.5L37.5 19" /></svg>
          <svg class="result__cross" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 7.5v5.5M12 16.2v.3" /></svg>
          <span class="result__text" id="result-text"></span>
        </div>
      </div>

      <button class="verify" type="button" id="verify" disabled>تحقّق</button>
      <p class="visually-hidden" id="live" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="src/scripts/app.js"></script>
</body>
</html>
